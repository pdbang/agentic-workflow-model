description: Select a team by its name from the available teams.
input_schema:
  properties:
    Team Logo:
      description: URL of the team's logo.
      enum:
      - logo_1
      - logo_2
      - logo_3
      type: string
    Team Name:
      description: The name of the team to select.
      type: string
    Team Options:
      description: Filter teams based on their status.
      enum:
      - all
      - active
      - inactive
      type: string
    Team Role:
      description: The role of the team to select.
      enum:
      - development
      - marketing
      - sales
      type: string
    Team Size:
      description: The size of the team.
      type: integer
  required:
  - Team Name
  type: object
name: select_team
